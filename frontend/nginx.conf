server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers — applied to every response.
    add_header X-Content-Type-Options  "nosniff"                       always;
    add_header X-Frame-Options         "SAMEORIGIN"                    always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # index.html must never be cached: it references the hashed asset bundles,
    # and a stale copy keeps loading old JS forever after each deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Hashed assets are immutable — cache them aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Allow up to 3 MB so the backend's own 2 MB file-upload cap is
        # the enforcer, not nginx's 1 MB default.
        client_max_body_size 3m;
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
