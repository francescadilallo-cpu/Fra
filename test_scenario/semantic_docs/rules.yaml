disambiguation_rules:
  - id: R1
    name: "accountId < 0 = duplicati"
    description: "Record CRM con accountId negativo sono duplicati generati da sistemi legacy. Vengono sempre filtrati upstream (WHERE accountId > 0). Nessun dipendente può quindi aver gestito un cliente duplicato nel sistema pulito."

  - id: R2
    name: "revenue vs subtotal (ambiguità fatturato)"
    description: "Il termine 'fatturato' può riferirsi a total_due (con tasse, default) o subtotal (senza tasse). Senza qualificatore esplicito il sistema usa total_due. Specificare 'netto' o 'subtotal' per il valore senza tasse."

  - id: R3
    name: "HR freshness Delayed"
    description: "I dati HR hanno sync status 'Delayed'. Il conteggio dipendenti e i dati anagrafici riflettono l'ultimo snapshot disponibile, non il dato in tempo reale. Per dati HR aggiornati contattare il team IT."
