disambiguation_rules:
  - id: R1
    name: "accountId < 0 = duplicates"
    description: "CRM records with negative accountId are duplicates generated by legacy systems. They are always filtered upstream (WHERE accountId > 0). No employee can therefore have managed a duplicate customer in the clean system."

  - id: R2
    name: "revenue vs subtotal (fatturato ambiguity)"
    description: "The term 'fatturato' can refer to total_due (with taxes, default) or subtotal (without taxes). Without an explicit qualifier the system uses total_due. Specify 'net' or 'subtotal' for the value without taxes."

  - id: R3
    name: "HR freshness Delayed"
    description: "HR data has sync status 'Delayed'. Employee counts and personal data reflect the last available snapshot, not real-time data. For up-to-date HR data contact the IT team."
