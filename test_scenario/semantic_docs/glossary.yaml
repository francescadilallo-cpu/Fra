terms:
  - term: cliente attivo
    definition: "CRM customer with accountId > 0. Records with negative accountId are duplicates and are always filtered (Rule R1)."

  - term: fatturato
    definition: "SUM(total_due) from sales_order_header. Includes taxes. For the net value (without taxes) use subtotal."

  - term: revenue
    definition: "Synonym for fatturato. SUM(total_due) in USD."

  - term: margine
    definition: "Revenue minus standard PIM cost per salesperson. Approximation: cost = standardCost × qty_ordered."

  - term: duplicato
    definition: "CRM record with accountId < 0, generated by legacy systems. Automatically filtered by Rule R1."

  - term: accountid
    definition: "Unique CRM customer identifier. Positive = real customer. Negative = duplicate from merger."

  - term: make only
    definition: "PIM product with make_flag = true. Manufactured internally, not purchased from external suppliers."

  - term: hr freshness
    definition: "HR data has sync status 'Delayed'. The employee count reflects the last available snapshot, not real-time data."

  - term: revenue_with_tax
    definition: "Revenue with calculated VAT. tax_rate applied per territory."

  - term: active_customers
    definition: "CRM customers (accountId > 0) that have at least one order in ERP. Calculated as inner join CRM-ERP."
