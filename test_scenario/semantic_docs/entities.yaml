entities:
  - name: Customer
    display_name: Customer
    synonyms: [cliente, clienti, customer, customers, account, accounts]
    description: "CRM customers with positive accountId"
    source: crm
    primary_key: accountId
    filter_active: "accountId > 0"

  - name: SalesOrder
    display_name: Order
    synonyms: [ordine, ordini, order, orders, vendita, vendite, transazione]
    description: "ERP orders from sales_order_header"
    source: erp
    primary_key: order_id

  - name: Employee
    display_name: Employee
    synonyms: [dipendente, dipendenti, employee, employees, persona, persone]
    description: "HR employees"
    source: hr
    primary_key: employee_id
    freshness: delayed

  - name: Product
    display_name: Product
    synonyms: [prodotto, prodotti, product, products, articolo, articoli, sku]
    description: "PIM products"
    source: hr_pim
    primary_key: internal_id

  - name: Territory
    display_name: Territory
    synonyms: [territorio, territori, territory, territories, area, regione]
    description: "ERP sales territories"
    source: erp
    primary_key: territory_id

  - name: Salesperson
    display_name: Salesperson
    synonyms: [venditore, venditori, salesperson, salespersons, agente, agenti]
    description: "ERP salespersons (salesperson_ref on sales_order_header)"
    source: erp
    primary_key: salesperson_ref

  - name: ProductCategory
    display_name: Product Category
    synonyms: [categoria, categorie, category, categories]
    description: "PIM product categories"
    source: hr_pim
    primary_key: category
